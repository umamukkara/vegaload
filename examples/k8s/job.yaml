# A load test as a plain Kubernetes Job, with no Helm. It needs only access to
# one namespace. Change the target and the image, then:
#
#   kubectl apply -f job.yaml
#   kubectl wait --for=condition=complete --timeout=10m job/vegaload-smoke
#   kubectl logs job/vegaload-smoke
#
# A broken threshold exits with code 3, so the Job is marked Failed. Delete the
# Job to run it again: kubectl delete job vegaload-smoke
#
# The image below is not published yet. Build it from the repository's
# Dockerfile, push it to a registry your cluster can pull from, and put that
# name here (see "Install" in the README).
apiVersion: batch/v1
kind: Job
metadata:
  name: vegaload-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the /tmp emptyDir writable by this user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vegaload
          image: ghcr.io/vegaload/vegaload:0.4.0
          args:
            - run
            - -no-open
            - -no-report
            - -audit-log
            - /tmp/vegaload-audit.log
            - -vus
            - "5"
            - -duration
            - 30s
            - -threshold
            - p95 < 300ms
            - -threshold
            - error_rate < 1%
            # The target's host must be allowed, or the run asks for confirmation.
            - -allow-target
            - orders.shop.svc.cluster.local
            - -target
            - http://orders.shop.svc.cluster.local:8080/health
            - -protocol
            - http1
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
