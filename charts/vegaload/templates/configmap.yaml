{{- if .Values.scenario }}
apiVersion: v1
kind: ConfigMap
metadata:
  # One ConfigMap per revision, so an upgrade does not rewrite the scenario
  # that an earlier Job used.
  name: {{ include "vegaload.fullname" . }}-scenario-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaload.labels" . | nindent 4 }}
data:
  {{ .Values.scenarioFileName | quote }}: |
    {{- .Values.scenario | nindent 4 }}
{{- end }}
