apiVersion: batch/v1
kind: Job
metadata:
  # A Job cannot be changed after it is created, so every revision (every
  # `helm upgrade`) is a new Job. Helm deletes any object that is no longer in
  # the new manifest, and the old Job is not. The keep policy stops that, so
  # the old Job and its logs stay until ttlSecondsAfterFinished removes them.
  name: {{ include "vegaload.fullname" . }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vegaload.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  {{- if .Values.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vegaload.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the /tmp emptyDir writable by this user. Without it the
        # volume is owned by root and the audit log cannot be written.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vegaload
          image: {{ include "vegaload.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "vegaload.args" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.scenario }}
            - name: scenario
              mountPath: /scenario
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.scenario }}
        - name: scenario
          configMap:
            name: {{ include "vegaload.fullname" . }}-scenario-{{ .Release.Revision }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
