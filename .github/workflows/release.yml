name: Release

# Runs when a version tag such as v0.1.0 is pushed. Builds the binaries,
# creates the GitHub release, updates the Homebrew formula in
# vegaload/homebrew-tap, and publishes the container image to
# ghcr.io/vegaload/vegaload (linux/amd64 and linux/arm64), and publishes the
# Helm chart to oci://ghcr.io/vegaload/charts.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  # Stops the release before anything is published if the Helm chart's
  # default image would not be the one this tag publishes.
  check-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-chart-version.sh "${GITHUB_REF_NAME}"

  release:
    needs: check-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned to v2: the `brews` block is deprecated and goes away in v3.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Two tags can point at one commit (v0.7.0-rc.1 and v0.7.0). GoReleaser
          # then picks one of them on its own, and it picked the older
          # pre-release. Name the tag that started this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  image:
    needs: check-chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag v0.5.0 becomes the image tags 0.5.0 and latest. The chart's
      # default image tag is the version without the "v". A pre-release tag
      # such as v0.5.0-rc.1 gets only its own tag: the action adds "latest"
      # for stable versions only.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vegaload/vegaload
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publishes the Helm chart as an OCI package, after the image it points to
  # exists. The chart version and the app version are both the tag without the
  # "v", so `helm install --version 0.7.0` runs image 0.7.0.
  chart:
    needs: [check-chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/vegaload --version "$version" --app-version "$version" --destination dist-chart
          ls -l dist-chart
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push the chart
        run: helm push dist-chart/vegaload-*.tgz oci://ghcr.io/vegaload/charts
