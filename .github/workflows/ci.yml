name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # examples/sample-app is its own Go module, so the ./... above
      # doesn't reach it.
      - name: Sample app
        working-directory: examples/sample-app
        run: |
          go vet ./...
          go test ./...
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # Builds and tests on Windows, which the release also ships. Python-driven
  # tests skip themselves when no Python 3 is found.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: The binary runs
        shell: bash
        run: |
          go build -o vegaload.exe ./cmd/vegaload
          ./vegaload.exe version
          ./vegaload.exe doctor || true

  # Builds every release target and the Homebrew formula without publishing,
  # so a broken .goreleaser.yaml fails in a PR and not on release day.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_TOKEN: dry-run

  # Runs the GitHub Action (action.yml) from this repository against the
  # sample app on Linux and macOS. The action installs the latest release,
  # so the threshold checks only run once a release that has -threshold exists.
  github-action:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Start the sample app
        run: |
          cd examples/sample-app
          go build -o "$RUNNER_TEMP/sample-app" .
          ("$RUNNER_TEMP/sample-app" -addr 127.0.0.1:18080 > "$RUNNER_TEMP/sample-app.log" 2>&1 &)
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then ok=true; break; fi
            sleep 1
          done
          if [ "$ok" != true ]; then
            echo "The sample app did not start. Its log:"
            cat "$RUNNER_TEMP/sample-app.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/widgets
      - name: Install only
        id: install
        uses: ./
      - name: The binary is on the PATH
        run: |
          test -n "${{ steps.install.outputs.version }}"
          vegaload version
      - name: Run a load test through the action
        uses: ./
        with:
          args: >-
            run -target http://127.0.0.1:18080/widgets -protocol http1
            -vus 2 -duration 3s -no-report -no-open
      - name: Does this release support thresholds?
        id: thresholds
        run: |
          if vegaload run -h 2>&1 | grep -q -- '-threshold'; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "The latest release has no -threshold yet, skipping the threshold checks."
          fi
      - name: A threshold that holds passes the step
        if: steps.thresholds.outputs.supported == 'true'
        uses: ./
        with:
          args: >-
            run -target http://127.0.0.1:18080/widgets -protocol http1
            -vus 2 -duration 3s -no-report -no-open
            -threshold "p95 < 5s" -threshold "error_rate < 50%"
      - name: A broken threshold fails the step
        if: steps.thresholds.outputs.supported == 'true'
        id: breach
        continue-on-error: true
        uses: ./
        with:
          args: >-
            run -target http://127.0.0.1:18080/widgets -protocol http1
            -vus 2 -duration 3s -no-report -no-open
            -threshold "fast: p95 < 1us"
      - name: The broken threshold really failed the step
        if: steps.thresholds.outputs.supported == 'true'
        run: test "${{ steps.breach.outcome }}" = "failure"

  # Checks the Helm chart: lint, and renders it with different values.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/vegaload --set run.target=http://example.svc:8080/health --set run.protocol=http1
      - run: ./charts/vegaload/test.sh

  # Builds the container image for both architectures, so a broken Dockerfile
  # fails in a PR and not on release day, then runs the amd64 image.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # A multi-architecture result cannot be loaded into the local
          # Docker engine, so build it and keep only the cache.
          outputs: type=cacheonly
      - name: Run the amd64 image
        run: |
          docker buildx build --load --build-arg VERSION=ci -t vegaload:ci .
          docker run --rm vegaload:ci version
